[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mobile_android"
version = "0.1.0"
description = "Read an adb backup (.ab) archive: header parse, zlib decompression, and tar-member inventory (package, category, path, size, mtime) via the standard library's tarfile; --extract-dir preserves the real tree. Unencrypted backups only in v0.1"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "mobile", "android", "adb", "backup"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/mobile/mobile_android"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
mobile_android = "mobile_android.cli:main"
[tool.setuptools]
packages = ["mobile_android"]
[tool.pytest.ini_options]
testpaths = ["tests"]
