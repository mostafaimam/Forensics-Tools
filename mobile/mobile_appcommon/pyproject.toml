[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mobile_appcommon"
version = "0.1.0"
description = "Generic inspector for binary blobs found throughout a mobile extraction: binary property lists (with NSKeyedArchiver unwrapping) and schemaless Protocol Buffers wire-format decoding, no .proto schema needed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "mobile", "plist", "protobuf", "nskeyedarchiver"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/mobile/mobile_appcommon"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
mobile_appcommon = "mobile_appcommon.cli:main"
[tool.setuptools]
packages = ["mobile_appcommon"]
[tool.pytest.ini_options]
testpaths = ["tests"]
