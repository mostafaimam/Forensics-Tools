[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mounting_partitions"
version = "0.1.0"
description = "map the MBR / GPT partition layout of a raw / EWF / VHD / VMDK disk image and identify the filesystem in each slice (no mounting)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "disk image", "mbr", "gpt", "partitions", "filesystem", "layout"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/mounting/mounting_partitions"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
mounting_partitions = "mounting_partitions.cli:main"
[tool.setuptools]
packages = ["mounting_partitions", "mounting_partitions.formats"]
[tool.pytest.ini_options]
testpaths = ["tests"]
