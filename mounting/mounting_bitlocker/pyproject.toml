[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mounting_bitlocker"
version = "0.1.0"
description = "Unlock a BitLocker volume with a supplied recovery password: FVE metadata parsing, key-stretch KDF, AES-CCM VMK/FVEK unwrap, AES-CBC/XTS sector decryption; bundled AES/CCM, IR-scoped no brute forcing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "bitlocker", "decryption", "incident response", "fve", "aes-xts"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/mounting/mounting_bitlocker"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
mounting_bitlocker = "mounting_bitlocker.cli:main"
[tool.setuptools]
packages = ["mounting_bitlocker"]
[tool.pytest.ini_options]
testpaths = ["tests"]
