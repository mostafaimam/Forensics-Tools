[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mounting_luks"
version = "0.1.0"
description = "Unlock a LUKS1 volume with a supplied passphrase: PBKDF2 key-slot derivation, AES-CBC-ESSIV + anti-forensic (af_sha1) key-material recovery, master-key digest verification, sector decryption; bundled AES, no brute forcing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "luks", "dm-crypt", "decryption", "incident response"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/mounting/mounting_luks"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
mounting_luks = "mounting_luks.cli:main"
[tool.setuptools]
packages = ["mounting_luks"]
[tool.pytest.ini_options]
testpaths = ["tests"]
