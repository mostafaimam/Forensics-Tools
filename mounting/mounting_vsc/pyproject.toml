[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mounting_vsc"
version = "0.1.0"
description = "Best-effort Volume Shadow Copy (VSS) discovery: VSS identifier GUID scan plus candidate FILETIME/GUID field surfacing. Does not mount or reconstruct snapshot content - the block-remapping format is reverse-engineered-only and unverified"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "vss", "shadow-copy", "ntfs"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/mounting/mounting_vsc"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
mounting_vsc = "mounting_vsc.cli:main"
[tool.setuptools]
packages = ["mounting_vsc"]
[tool.pytest.ini_options]
testpaths = ["tests"]
