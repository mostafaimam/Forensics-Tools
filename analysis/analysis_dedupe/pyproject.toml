[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "analysis_dedupe"
version = "0.1.0"
description = "Hash-based deduplication and distinct-file sets; diff a target set against a baseline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "dedupe", "hash", "distinct files", "e-discovery"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/analysis/analysis_dedupe"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
analysis_dedupe = "analysis_dedupe.cli:main"
[tool.setuptools]
packages = ["analysis_dedupe"]
[tool.pytest.ini_options]
testpaths = ["tests"]
