[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "analysis_dpapi"
version = "0.1.0"
description = "Decrypt Windows DPAPI master keys and data blobs with a supplied password + SID (IR-scoped, no brute forcing); bundled pure-Python AES"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "dpapi", "decryption", "incident response", "credentials", "masterkey"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/analysis/analysis_dpapi"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
analysis_dpapi = "analysis_dpapi.cli:main"
[tool.setuptools]
packages = ["analysis_dpapi"]
[tool.pytest.ini_options]
testpaths = ["tests"]
