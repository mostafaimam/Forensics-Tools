[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "analysis_encryption"
version = "0.1.0"
description = "Detect encrypted / password-protected files and containers (report only, no cracking)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "encryption", "bitlocker", "luks", "veracrypt", "entropy"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/analysis/analysis_encryption"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
analysis_encryption = "analysis_encryption.cli:main"
[tool.setuptools]
packages = ["analysis_encryption"]
[tool.pytest.ini_options]
testpaths = ["tests"]
