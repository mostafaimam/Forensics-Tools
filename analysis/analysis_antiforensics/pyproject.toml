[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "analysis_antiforensics"
version = "0.1.0"
description = "Correlate anti-forensic / tampering indicators from other tools' CSV / JSON output into one findings list + HTML report"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "anti-forensics", "tampering", "timestomp", "log clearing", "wiping"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/analysis/analysis_antiforensics"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
analysis_antiforensics = "analysis_antiforensics.cli:main"
[tool.setuptools]
packages = ["analysis_antiforensics"]
[tool.pytest.ini_options]
testpaths = ["tests"]
