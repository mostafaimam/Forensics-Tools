[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "analysis_index"
version = "0.1.0"
description = "Full-text index and search over a file collection - boolean / phrase / proximity / regex queries, keyword-in-context snippets, no FTS extension required"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "full-text", "index", "search", "e-discovery", "keyword"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/analysis/analysis_index"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
analysis_index = "analysis_index.cli:main"
analysis_search = "analysis_index.cli:search_main"
[tool.setuptools]
packages = ["analysis_index"]
[tool.pytest.ini_options]
testpaths = ["tests"]
