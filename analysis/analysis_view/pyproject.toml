[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "analysis_view"
version = "0.1.0"
description = "Review any tabular evidence (CSV / TSV / JSON / XLSX): merge, filter, sort, tag, annotate, export an interactive HTML review page"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "review", "csv", "xlsx", "triage", "bookmarking"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/analysis/analysis_view"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
analysis_view = "analysis_view.cli:main"
[tool.setuptools]
packages = ["analysis_view"]
[tool.pytest.ini_options]
testpaths = ["tests"]
