[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "analysis_kff"
version = "0.1.0"
description = "Known File Filter - import NSRL / Project VIC / HashKeeper / plain hash sets into a local index and classify files or hashes as known-good / known-bad / notable / unknown"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "kff", "nsrl", "hash set", "known file filter", "rds", "project vic"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/analysis/analysis_kff"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
analysis_kff = "analysis_kff.cli:main"
[tool.setuptools]
packages = ["analysis_kff"]
[tool.pytest.ini_options]
testpaths = ["tests"]
