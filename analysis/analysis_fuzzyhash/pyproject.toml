[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "analysis_fuzzyhash"
version = "0.1.0"
description = "Similarity hashing (CTPH / ssdeep-style, TLSH-style locality digest, PE imphash + rich-header hash) and similarity clustering of a file set"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "ssdeep", "tlsh", "fuzzy hashing", "imphash", "clustering", "malware"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/analysis/analysis_fuzzyhash"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
analysis_fuzzyhash = "analysis_fuzzyhash.cli:main"
[tool.setuptools]
packages = ["analysis_fuzzyhash"]
[tool.pytest.ini_options]
testpaths = ["tests"]
