[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "utilities_strings"
version = "0.1.0"
description = "String extraction (ASCII + UTF-16 LE/BE, byte offsets) from any file / image / device with a built-in forensic pattern library and category filters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "strings", "ioc", "patterns", "triage", "carving"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/utilities/utilities_strings"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
utilities_strings = "utilities_strings.cli:main"
[tool.setuptools]
packages = ["utilities_strings"]
[tool.pytest.ini_options]
testpaths = ["tests"]
