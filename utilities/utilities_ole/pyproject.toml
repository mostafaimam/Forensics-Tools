[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "utilities_ole"
version = "0.1.0"
description = "OLE2 / compound-file reader and Office metadata extraction: stream tree, SummaryInformation / OOXML properties, VBA macro source (MS-OVBA decompression), embedded objects, external targets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "ole2", "cfb", "office", "metadata", "vba", "macros", "ooxml"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/utilities/utilities_ole"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
utilities_ole = "utilities_ole.cli:main"
[tool.setuptools]
packages = ["utilities_ole"]
[tool.pytest.ini_options]
testpaths = ["tests"]
