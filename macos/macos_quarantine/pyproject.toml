[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_quarantine"
version = "0.1.0"
description = "parse com.apple.LaunchServices.QuarantineEventsV2: macOS download provenance - agent, data URL, origin URL, timestamp, with dangerous-download flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "quarantine", "gatekeeper", "downloads", "launchservices"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_quarantine"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_quarantine = "macos_quarantine.cli:main"
[tool.setuptools]
packages = ["macos_quarantine"]
[tool.pytest.ini_options]
testpaths = ["tests"]
