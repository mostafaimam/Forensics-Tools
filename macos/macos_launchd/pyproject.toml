[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_launchd"
version = "0.1.0"
description = "review macOS LaunchAgents / LaunchDaemons persistence: program, triggers, run-as, with writable-path / cradle / DYLD-injection / masquerade flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "launchd", "launchagents", "launchdaemons", "persistence"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_launchd"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_launchd = "macos_launchd.cli:main"
[tool.setuptools]
packages = ["macos_launchd"]
[tool.pytest.ini_options]
testpaths = ["tests"]
