[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_installhistory"
version = "0.1.0"
description = "parse InstallHistory.plist + /var/db/receipts: the macOS install-event timeline and per-package receipts, correlated, with unusual-install flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "installhistory", "receipts", "packages"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_installhistory"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_installhistory = "macos_installhistory.cli:main"
[tool.setuptools]
packages = ["macos_installhistory"]
[tool.pytest.ini_options]
testpaths = ["tests"]
