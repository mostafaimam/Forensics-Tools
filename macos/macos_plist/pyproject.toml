[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_plist"
version = "0.1.0"
description = "Read macOS property lists (binary/XML), unwrap NSKeyedArchiver, flatten to CSV/JSON"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "plist", "bplist", "nskeyedarchiver"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_plist"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_plist = "macos_plist.cli:main"
[tool.setuptools]
packages = ["macos_plist"]
[tool.pytest.ini_options]
testpaths = ["tests"]
