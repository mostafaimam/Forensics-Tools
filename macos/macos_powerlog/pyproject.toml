[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_powerlog"
version = "0.1.0"
description = "parse CurrentPowerlog.PLSQL: app usage / process / camera / microphone / location / battery event timeline from the macOS PowerLog"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "powerlog", "plsql", "camera", "location", "timeline"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_powerlog"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_powerlog = "macos_powerlog.cli:main"
[tool.setuptools]
packages = ["macos_powerlog"]
[tool.pytest.ini_options]
testpaths = ["tests"]
