[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_fsevents"
version = "0.1.0"
description = "parse the macOS /.fseventsd file-system change log: per-path create / delete / rename / modify records with decoded flags and node ids"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "fsevents", "fseventsd", "filesystem", "timeline"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_fsevents"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_fsevents = "macos_fsevents.cli:main"
[tool.setuptools]
packages = ["macos_fsevents"]
[tool.pytest.ini_options]
testpaths = ["tests"]
