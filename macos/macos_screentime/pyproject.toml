[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_screentime"
version = "0.1.0"
description = "Parse Screen Time app / category daily usage totals from RMAdminStore-Local.sqlite via generic Core Data (Z_PRIMARYKEY) entity introspection - schema-drift tolerant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "screentime", "coredata", "app usage", "sqlite"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_screentime"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_screentime = "macos_screentime.cli:main"
[tool.setuptools]
packages = ["macos_screentime"]
[tool.pytest.ini_options]
testpaths = ["tests"]
