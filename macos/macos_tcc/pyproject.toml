[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_tcc"
version = "0.1.0"
description = "parse the macOS TCC.db privacy-permission database (system + per-user): who was granted Camera / Mic / Accessibility / Screen Recording / Full Disk Access / Automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "tcc", "privacy", "permissions", "accessibility"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_tcc"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_tcc = "macos_tcc.cli:main"
[tool.setuptools]
packages = ["macos_tcc"]
[tool.pytest.ini_options]
testpaths = ["tests"]
