[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "macos_coreanalytics"
version = "0.1.0"
description = "Parse CoreAnalytics (.core_analytics) app-usage aggregates: daily launch counts, foreground/active time; schema-tolerant plist/NDJSON reader"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "macos", "coreanalytics", "app usage", "diagnostics"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/macos/macos_coreanalytics"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
macos_coreanalytics = "macos_coreanalytics.cli:main"
[tool.setuptools]
packages = ["macos_coreanalytics"]
[tool.pytest.ini_options]
testpaths = ["tests"]
