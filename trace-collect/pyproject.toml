[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-collect"
version = "0.1.0"
description = "Cross-platform targeted forensic triage collector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "triage", "acquisition", "incident-response"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/trace-collect"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"

[project.scripts]
trace-collect = "trace_collect.cli:main"

[tool.setuptools]
packages = ["trace_collect", "trace_collect.readers"]

[tool.setuptools.package-data]
trace_collect = ["targets/**/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
