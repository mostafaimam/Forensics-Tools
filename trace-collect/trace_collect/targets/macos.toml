# Built-in macOS triage targets for trace-collect.
# %Home% fans out over every real user home under /Users.

[[target]]
id = "macos-unified-logs"
name = "Unified log archives (.tracev3) and uuidtext"
category = "Logs"
os = ["macos"]
paths = [
  { path = "/var/db/diagnostics", recursive = true },
  { path = "/var/db/uuidtext", recursive = true },
]

[[target]]
id = "macos-install-history"
name = "Software install history and receipts"
category = "SoftwareInventory"
os = ["macos"]
paths = [
  { path = "/Library/Receipts/InstallHistory.plist" },
  { path = "/var/db/receipts", recursive = true },
  { path = "/Library/Logs/Install.log*" },
]

[[target]]
id = "macos-launch-items"
name = "LaunchAgents / LaunchDaemons (persistence)"
category = "Persistence"
os = ["macos"]
paths = [
  { path = "/Library/LaunchAgents", recursive = true },
  { path = "/Library/LaunchDaemons", recursive = true },
  { path = "/System/Library/LaunchAgents", recursive = true },
  { path = "/System/Library/LaunchDaemons", recursive = true },
  { path = "%Home%/Library/LaunchAgents", recursive = true },
]

[[target]]
id = "macos-cron-periodic"
name = "cron, periodic and at jobs"
category = "Persistence"
os = ["macos"]
paths = [
  { path = "/etc/crontab" },
  { path = "/etc/periodic", recursive = true },
  { path = "/usr/lib/cron", recursive = true },
  { path = "/var/at", recursive = true },
]

[[target]]
id = "macos-shell-history"
name = "Shell history and sessions"
category = "UserActivity"
os = ["macos"]
paths = [
  { path = "%Home%/.bash_history" },
  { path = "%Home%/.zsh_history" },
  { path = "%Home%/.zsh_sessions", recursive = true },
  { path = "%Home%/.python_history" },
  { path = "%Home%/.lesshst" },
]

[[target]]
id = "macos-quarantine"
name = "LaunchServices quarantine events (downloads)"
category = "Downloads"
os = ["macos"]
paths = [
  { path = "%Home%/Library/Preferences/com.apple.LaunchServices.QuarantineEventsV2" },
]

[[target]]
id = "macos-fsevents"
name = "FSEvents (filesystem change log)"
category = "FileSystem"
os = ["macos"]
paths = [
  { path = "/.fseventsd", recursive = true },
]

[[target]]
id = "macos-accounts"
name = "Local account records"
category = "Accounts"
os = ["macos"]
paths = [
  { path = "/var/db/dslocal/nodes/Default/users", recursive = true },
  { path = "/var/db/dslocal/nodes/Default/groups", recursive = true },
  { path = "/etc/sudoers" },
  { path = "/etc/sudoers.d", recursive = true },
]

[[target]]
id = "macos-knowledgec"
name = "KnowledgeC / CoreDuet activity databases"
category = "UserActivity"
os = ["macos"]
paths = [
  { path = "%Home%/Library/Application Support/Knowledge/knowledgeC.db*" },
  { path = "/private/var/db/CoreDuet/Knowledge", recursive = true },
]

[[target]]
id = "macos-safari"
name = "Safari browsing artefacts"
category = "Browser"
os = ["macos"]
paths = [
  { path = "%Home%/Library/Safari/History.db*" },
  { path = "%Home%/Library/Safari/Downloads.plist" },
  { path = "%Home%/Library/Safari/Bookmarks.plist" },
  { path = "%Home%/Library/Safari/LastSession.plist" },
  { path = "%Home%/Library/Safari/TopSites.plist" },
]

[[target]]
id = "macos-browser-chromium"
name = "Chromium browsers (Chrome / Edge / Brave)"
category = "Browser"
os = ["macos"]
paths = [
  { path = "%Home%/Library/Application Support/Google/Chrome/*/History" },
  { path = "%Home%/Library/Application Support/Google/Chrome/*/Cookies" },
  { path = "%Home%/Library/Application Support/Google/Chrome/*/Login Data" },
  { path = "%Home%/Library/Application Support/Microsoft Edge/*/History" },
]

[[target]]
id = "macos-network-config"
name = "Network configuration"
category = "Network"
os = ["macos"]
paths = [
  { path = "/etc/hosts" },
  { path = "/Library/Preferences/SystemConfiguration", recursive = true },
]

[[target]]
id = "macos-loginwindow"
name = "loginwindow preferences (auto-launch / last user)"
category = "Persistence"
os = ["macos"]
paths = [
  { path = "/Library/Preferences/com.apple.loginwindow.plist" },
  { path = "%Home%/Library/Preferences/com.apple.loginwindow.plist" },
  { path = "%Home%/Library/Preferences/ByHost", recursive = true },
]

[[target]]
id = "macos-system-info"
name = "OS version and system identification"
category = "SystemInfo"
os = ["macos"]
paths = [
  { path = "/System/Library/CoreServices/SystemVersion.plist" },
  { path = "/Library/Preferences/SystemConfiguration/preferences.plist" },
  { path = "/etc/fstab" },
]
