[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "linux_persistence"
version = "0.1.0"
description = "one sweep for every userland Linux persistence vector: shell rc, ld.so.preload, rc.local, motd, xinetd, PAM, modprobe, udev, sudoers, systemd generators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "linux", "persistence", "ld.so.preload", "sudoers", "pam", "udev"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/linux/linux_persistence"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
linux_persistence = "linux_persistence.cli:main"
[tool.setuptools]
packages = ["linux_persistence"]
[tool.pytest.ini_options]
testpaths = ["tests"]
