[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "linux_networkmgr"
version = "0.1.0"
description = "saved network config + joined networks: NetworkManager profiles, wpa_supplicant, systemd-networkd, netplan, /etc/hosts, resolv.conf, with a risk review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "linux", "networkmanager", "wpa_supplicant", "netplan", "dns", "wifi"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/linux/linux_networkmgr"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
linux_networkmgr = "linux_networkmgr.cli:main"
[tool.setuptools]
packages = ["linux_networkmgr"]
[tool.pytest.ini_options]
testpaths = ["tests"]
