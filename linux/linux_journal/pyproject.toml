[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "linux_journal"
version = "0.1.0"
description = "from-scratch reader for the systemd journal (.journal) binary format: entries, fields, boots, filters, one merged UTC timeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "linux", "systemd", "journal", "logs", "timeline"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/linux/linux_journal"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
linux_journal = "linux_journal.cli:main"
[tool.setuptools]
packages = ["linux_journal"]
[tool.pytest.ini_options]
testpaths = ["tests"]
