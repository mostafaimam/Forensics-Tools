[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "linux_packages"
version = "0.1.0"
description = "package install / upgrade / remove timeline from dpkg / apt / dnf / yum logs and the dnf history.sqlite, with toolchain / recon / tunnel / anti-forensic flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "linux", "packages", "dpkg", "apt", "dnf", "yum", "timeline"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/linux/linux_packages"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
linux_packages = "linux_packages.cli:main"
[tool.setuptools]
packages = ["linux_packages"]
[tool.pytest.ini_options]
testpaths = ["tests"]
