[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "linux_containers"
version = "0.1.0"
description = "reconstruct Docker / Podman / containerd containers from on-disk state: config, mounts, ports, logs, and a privileged / socket / host-namespace security review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "linux", "docker", "podman", "containerd", "containers"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/linux/linux_containers"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
linux_containers = "linux_containers.cli:main"
[tool.setuptools]
packages = ["linux_containers"]
[tool.pytest.ini_options]
testpaths = ["tests"]
