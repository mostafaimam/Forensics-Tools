[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "linux_bashhist"
version = "0.1.0"
description = "Recover, merge and triage shell / REPL history across all users (bash, zsh, fish, sh, python, mysql, psql, sqlite, node, redis)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "linux", "bash", "history", "zsh", "fish", "shell"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/linux/linux_bashhist"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
linux_bashhist = "linux_bashhist.cli:main"
[tool.setuptools]
packages = ["linux_bashhist"]
[tool.pytest.ini_options]
testpaths = ["tests"]
