[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "linux_units"
version = "0.1.0"
description = "systemd unit-file inventory and persistence review: merge drop-ins, resolve enable state, flag writable ExecStart / cradles / respawners"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "linux", "systemd", "units", "persistence"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/linux/linux_units"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
linux_units = "linux_units.cli:main"
[tool.setuptools]
packages = ["linux_units"]
[tool.pytest.ini_options]
testpaths = ["tests"]
