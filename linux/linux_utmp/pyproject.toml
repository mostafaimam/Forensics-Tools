[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "linux_utmp"
version = "0.1.0"
description = "Parse Linux login records: wtmp / btmp / utmp and lastlog, with session pairing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "linux", "wtmp", "utmp", "lastlog", "logins"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/linux/linux_utmp"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
linux_utmp = "linux_utmp.cli:main"
[tool.setuptools]
packages = ["linux_utmp"]
[tool.pytest.ini_options]
testpaths = ["tests"]
