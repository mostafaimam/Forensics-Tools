[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "network_arp"
version = "0.1.0"
description = "IP <-> MAC <-> hostname <-> time mapping from dhcpd.leases, Windows DHCP audit, arp / ip neigh dumps and pcap ARP frames"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "network", "arp", "dhcp", "mac", "attribution"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/network/network_arp"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
network_arp = "network_arp.cli:main"
[tool.setuptools]
packages = ["network_arp"]
[tool.pytest.ini_options]
testpaths = ["tests"]
