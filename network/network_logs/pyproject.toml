[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "network_logs"
version = "0.1.0"
description = "Normalise firewall / proxy / IDS text logs (iptables, pflog, Windows Firewall, Squid, Zeek, Suricata) into one flow / event schema"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "network", "firewall", "ids", "zeek", "suricata", "squid"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/network/network_logs"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
network_logs = "network_logs.cli:main"
[tool.setuptools]
packages = ["network_logs"]
[tool.pytest.ini_options]
testpaths = ["tests"]
