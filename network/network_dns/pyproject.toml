[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "network_dns"
version = "0.1.0"
description = "Consolidate DNS evidence from captures, resolver caches and hosts files into one name-resolution timeline with tunnelling / DGA / override flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "network", "dns", "pcap", "tunnelling", "dga"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/network/network_dns"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
network_dns = "network_dns.cli:main"
[tool.setuptools]
packages = ["network_dns"]
[tool.pytest.ini_options]
testpaths = ["tests"]
