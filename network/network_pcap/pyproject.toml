[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "network_pcap"
version = "0.1.0"
description = "Pure-Python pcap / pcapng reader: flow reassembly, DNS / HTTP extraction, suspicious-traffic flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "network", "pcap", "pcapng", "flows", "dns", "http"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/network/network_pcap"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
network_pcap = "network_pcap.cli:main"
[tool.setuptools]
packages = ["network_pcap"]
[tool.pytest.ini_options]
testpaths = ["tests"]
