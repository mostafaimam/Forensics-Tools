[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_handles"
version = "0.1.0"
description = "Per-process open file handles from a Windows RAM dump: ObjectTable discovery by structural validation, multi-layout handle-entry decoding, _FILE_OBJECT resolution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "handles", "file object", "incident response"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_handles"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_handles = "memory_handles.cli:main"
[tool.setuptools]
packages = ["memory_handles"]
[tool.pytest.ini_options]
testpaths = ["tests"]
