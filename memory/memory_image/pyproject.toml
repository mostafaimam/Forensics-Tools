[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_image"
version = "0.1.0"
description = "Identify, map and convert RAM dumps (raw / LiME / ELF core / Windows crash dump); the shared loader for the memory_* tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "ram", "lime", "crash dump", "incident response"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_image"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_image = "memory_image.cli:main"
[tool.setuptools]
packages = ["memory_image"]
[tool.pytest.ini_options]
testpaths = ["tests"]
