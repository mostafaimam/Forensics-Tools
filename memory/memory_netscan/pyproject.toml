[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_netscan"
version = "0.1.0"
description = "Recover network connections and sockets from a Windows RAM dump by pool-tag scanning (finds hidden and closed connections, profile-independent)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "network", "netscan", "tcpip", "incident response"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_netscan"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_netscan = "memory_netscan.cli:main"
[tool.setuptools]
packages = ["memory_netscan"]
[tool.pytest.ini_options]
testpaths = ["tests"]
