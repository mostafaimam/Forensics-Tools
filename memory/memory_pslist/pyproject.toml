[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_pslist"
version = "0.1.0"
description = "Enumerate Windows processes from a RAM dump by pool-tag scanning (finds hidden and exited processes, profile-independent)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "process", "psscan", "eprocess", "volatility"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_pslist"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_pslist = "memory_pslist.cli:main"
[tool.setuptools]
packages = ["memory_pslist"]
[tool.pytest.ini_options]
testpaths = ["tests"]
