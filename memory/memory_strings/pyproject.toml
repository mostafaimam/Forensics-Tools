[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_strings"
version = "0.1.0"
description = "Address-aware string extraction from a RAM dump with a built-in IOC pattern library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "strings", "ioc", "ram"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_strings"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_strings = "memory_strings.cli:main"
[tool.setuptools]
packages = ["memory_strings"]
[tool.pytest.ini_options]
testpaths = ["tests"]
