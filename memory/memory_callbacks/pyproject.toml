[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_callbacks"
version = "0.1.0"
description = "Best-effort scan for kernel notification-callback-array-shaped (small, mostly-NULL, clustered-pointer) tables in a Windows memory image - no symbol resolution, so candidates and flagged outliers are investigative leads, not confirmed named-table findings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "windows", "rootkit", "callbacks"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_callbacks"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_callbacks = "memory_callbacks.cli:main"
[tool.setuptools]
packages = ["memory_callbacks"]
[tool.pytest.ini_options]
testpaths = ["tests"]
