[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_linux"
version = "0.1.0"
description = "Best-effort Linux memory-image process-list recovery. task_struct has no cross-version signature, so a supplied kernel profile (direct-map base + field offsets) drives a genuine tasks-list walk; without one, falls back to weak heuristic comm-string carving"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "linux", "process-list"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_linux"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_linux = "memory_linux.cli:main"
[tool.setuptools]
packages = ["memory_linux"]
[tool.pytest.ini_options]
testpaths = ["tests"]
