[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_malfind"
version = "0.1.0"
description = "Find injected / unbacked executable memory in a Windows RAM dump by VAD pool-tag scanning (profile-independent)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "malfind", "injection", "shellcode", "vad", "incident response"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_malfind"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_malfind = "memory_malfind.cli:main"
[tool.setuptools]
packages = ["memory_malfind"]
[tool.pytest.ini_options]
testpaths = ["tests"]
