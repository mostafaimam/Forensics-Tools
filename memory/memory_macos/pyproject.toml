[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_macos"
version = "0.1.0"
description = "Best-effort macOS (XNU) memory-image process-list recovery. proc has no cross-version signature, so a supplied kernel profile drives a genuine BSD-LIST (allproc) walk; without one, falls back to weak heuristic comm-string carving. This suite's lowest-confidence memory tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "macos", "xnu", "process-list"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_macos"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_macos = "memory_macos.cli:main"
[tool.setuptools]
packages = ["memory_macos"]
[tool.pytest.ini_options]
testpaths = ["tests"]
