[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_consoles"
version = "0.1.0"
description = "Best-effort console-host process discovery (exact-name EPROCESS match) and generic command-line-shaped string carving from a Windows memory image. Does not decode CONSOLE_INFORMATION - undocumented, version-drifted, no reliable offset reference available"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "windows", "console", "command-history"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_consoles"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_consoles = "memory_consoles.cli:main"
[tool.setuptools]
packages = ["memory_consoles"]
[tool.pytest.ini_options]
testpaths = ["tests"]
