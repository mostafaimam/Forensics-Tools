[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_timers"
version = "0.1.0"
description = "Enumerate Windows kernel timers (KTIMER, x64) from a memory image via structural validation of the documented DISPATCHER_HEADER/KTIMER layout - no kernel symbols or global-list-head address needed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory-forensics", "windows", "ktimer", "kernel"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_timers"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_timers = "memory_timers.cli:main"
[tool.setuptools]
packages = ["memory_timers"]
[tool.pytest.ini_options]
testpaths = ["tests"]
