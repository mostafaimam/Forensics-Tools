[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_registry"
version = "0.1.0"
description = "List registry hives mapped in a Windows RAM dump by scanning for the regf base-block signature (file path, dirty status, last-written FILETIME), profile-independent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "memory", "registry", "hivelist", "incident response"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_registry"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_registry = "memory_registry.cli:main"
[tool.setuptools]
packages = ["memory_registry"]
[tool.pytest.ini_options]
testpaths = ["tests"]
