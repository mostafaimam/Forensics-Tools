[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory_lsasecrets"
version = "0.1.0"
description = "Decrypt LSA secrets from a SYSTEM + SECURITY hive pair: service-account passwords, DPAPI machine key, auto-logon passwords. Modern PolEKList/AES scheme only. Reporting only - no cracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "lsa", "secrets", "dpapi", "registry"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/memory/memory_lsasecrets"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
memory_lsasecrets = "memory_lsasecrets.cli:main"
[tool.setuptools]
packages = ["memory_lsasecrets", "memory_lsasecrets.hive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
