[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "browser_bookmarks"
version = "0.1.0"
description = "Bookmark tree with added / modified times from Chromium Bookmarks JSON (+ Bookmarks.bak diff) and Firefox moz_bookmarks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "browser", "bookmarks", "chrome", "firefox"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/browser/browser_bookmarks"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
browser_bookmarks = "browser_bookmarks.cli:main"
[tool.setuptools]
packages = ["browser_bookmarks"]
[tool.pytest.ini_options]
testpaths = ["tests"]
