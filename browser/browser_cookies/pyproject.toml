[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "browser_cookies"
version = "0.1.0"
description = "Cookies from Chrome / Edge / Firefox / Safari stores (read-only, WAL-safe) - host, expiry, flags, session/auth-token detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "browser", "cookies", "chrome", "firefox", "session"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/browser/browser_cookies"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
browser_cookies = "browser_cookies.cli:main"
[tool.setuptools]
packages = ["browser_cookies"]
[tool.pytest.ini_options]
testpaths = ["tests"]
