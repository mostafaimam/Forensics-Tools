[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "browser_logins"
version = "0.1.0"
description = "Saved-login metadata (origin, username, timestamps, use count) from Chromium Login Data and Firefox logins.json - passwords never decrypted"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "browser", "logins", "credentials", "chrome", "firefox"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/browser/browser_logins"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
browser_logins = "browser_logins.cli:main"
[tool.setuptools]
packages = ["browser_logins"]
[tool.pytest.ini_options]
testpaths = ["tests"]
