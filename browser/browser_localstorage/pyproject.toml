[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "browser_localstorage"
version = "0.1.0"
description = "From-scratch LevelDB reader (WAL log + SSTable + Snappy, all pure Python) for Chromium Local Storage and IndexedDB - recovers every key/value ever written, including overwritten/deleted entries, not just the current live value"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "browser", "chromium", "leveldb", "local-storage", "indexeddb", "snappy"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/browser/browser_localstorage"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
browser_localstorage = "browser_localstorage.cli:main"
[tool.setuptools]
packages = ["browser_localstorage"]
[tool.pytest.ini_options]
testpaths = ["tests"]
