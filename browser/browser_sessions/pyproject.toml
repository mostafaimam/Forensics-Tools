[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "browser_sessions"
version = "0.1.0"
description = "Tabs and windows open at last browser close from Chromium SNSS session files and Firefox sessionstore.jsonlz4 (bundled mozLz4 / LZ4 decoder)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "browser", "sessions", "tabs", "snss", "sessionstore"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/browser/browser_sessions"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
browser_sessions = "browser_sessions.cli:main"
[tool.setuptools]
packages = ["browser_sessions"]
[tool.pytest.ini_options]
testpaths = ["tests"]
