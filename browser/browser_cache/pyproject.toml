[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "browser_cache"
version = "0.1.0"
description = "List and extract cached HTTP responses from the Chromium Simple Cache and Firefox cache2 store (URL, status, content-type, timestamps, body + SHA-256)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "browser", "cache", "simple-cache", "cache2", "chrome", "firefox"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/browser/browser_cache"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
browser_cache = "browser_cache.cli:main"
[tool.setuptools]
packages = ["browser_cache"]
[tool.pytest.ini_options]
testpaths = ["tests"]
