[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "browser_shortcuts"
version = "0.1.0"
description = "Read Chromium's Shortcuts (omnibox typed-text -> URL, hit counts), Top Sites (new-tab frequency tiles) and Network Action Predictor (typed-prefix hit/miss counts) - browsing-intent artifacts separate from History"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "browser", "chromium", "omnibox", "shortcuts", "top-sites"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/browser/browser_shortcuts"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
browser_shortcuts = "browser_shortcuts.cli:main"
[tool.setuptools]
packages = ["browser_shortcuts"]
[tool.pytest.ini_options]
testpaths = ["tests"]
