[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-recycle"
version = "0.1.0"
description = "Cross-platform Windows Recycle Bin parser ($I / $R / INFO2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "recycle-bin", "incident-response", "windows"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/trace-recycle"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"

[project.scripts]
trace-recycle = "trace_recycle.cli:main"

[tool.setuptools]
packages = ["trace_recycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
