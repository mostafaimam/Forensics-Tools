[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_shimcache"
version = "0.1.0"
description = "Parse the Windows AppCompatCache / ShimCache (program presence and execution evidence)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "shimcache", "appcompatcache", "windows", "execution"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_shimcache"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_shimcache = "windows_shimcache.cli:main"
[tool.setuptools]
packages = ["windows_shimcache", "windows_shimcache.hive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
