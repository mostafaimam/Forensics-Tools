[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_wer"
version = "0.1.0"
description = "Windows Error Reporting forensics: parse .wer reports into one row per crash / hang (faulting app + path + version, faulting module, exception code / offset, event time, signature)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "wer", "crash", "execution-evidence", "appcrash"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_wer"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_wer = "windows_wer.cli:main"
[tool.setuptools]
packages = ["windows_wer"]
[tool.pytest.ini_options]
testpaths = ["tests"]
