[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_logfile"
version = "0.1.0"
description = "NTFS $LogFile transaction-log forensics: decode redo/undo operations and reconstruct file created / deleted / renamed events with FILE_NAME attributes and timestamps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "ntfs", "logfile", "journal", "timeline", "anti-forensics"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_logfile"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_logfile = "windows_logfile.cli:main"
[tool.setuptools]
packages = ["windows_logfile"]
[tool.pytest.ini_options]
testpaths = ["tests"]
