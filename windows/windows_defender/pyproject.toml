[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_defender"
version = "0.1.0"
description = "Microsoft Defender forensics: one detection timeline from MPLog, the Windows Defender Operational log, the RC4-obfuscated Quarantine store and SOFTWARE-hive exclusions / protection switches"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "defender", "antivirus", "quarantine", "mplog", "exclusions"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_defender"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_defender = "windows_defender.cli:main"
[tool.setuptools]
packages = ["windows_defender", "windows_defender.evtx", "windows_defender.hive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
