[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_pslogging"
version = "0.1.0"
description = "PowerShell forensics: reassemble ScriptBlock (4104) + Module (4103) logging and transcripts, decode -EncodedCommand / base64 / gzip payloads, flag cradles / AMSI bypass / obfuscation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "powershell", "scriptblock", "4104", "transcript", "evtx"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_pslogging"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_pslogging = "windows_pslogging.cli:main"
[tool.setuptools]
packages = ["windows_pslogging", "windows_pslogging.evtx"]
[tool.pytest.ini_options]
testpaths = ["tests"]
