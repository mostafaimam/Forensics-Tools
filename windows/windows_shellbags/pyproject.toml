[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_shellbags"
version = "0.1.0"
description = "reconstruct the shellbag folder-access tree from BagMRU / Bags in UsrClass.dat / NTUSER.DAT: full paths, last-interacted times, MFT refs, and a removable / network / archive review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "shellbags", "bagmru", "usrclass", "explorer", "timeline"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_shellbags"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_shellbags = "windows_shellbags.cli:main"
[tool.setuptools]
packages = ["windows_shellbags", "windows_shellbags.hive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
