[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_sqlmap"
version = "0.1.0"
description = "Locate SQLite databases by header magic and process them with declarative named maps (built-in + user --map-dir); unmatched databases get a schema recon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "sqlite", "app database", "chat", "recon"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_sqlmap"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_sqlmap = "windows_sqlmap.cli:main"
[tool.setuptools]
packages = ["windows_sqlmap"]
[tool.pytest.ini_options]
testpaths = ["tests"]
