[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_wmi"
version = "0.1.0"
description = "WMI repository persistence forensics: recover __EventFilter / *EventConsumer / __FilterToConsumerBinding subscriptions from OBJECTS.DATA and flag LOLBin / script / writable-path consumers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "wmi", "cim", "persistence", "eventconsumer", "fileless"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_wmi"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_wmi = "windows_wmi.cli:main"
[tool.setuptools]
packages = ["windows_wmi"]
[tool.pytest.ini_options]
testpaths = ["tests"]
