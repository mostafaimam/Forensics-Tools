[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_webcache"
version = "0.1.0"
description = "parse WebCacheV01.dat (WinINET history / cookies / cached content / downloads / DOM storage) into normalised rows with FILETIME timestamps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "wininet", "webcache", "ese", "history", "cookies"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_webcache"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_webcache = "windows_webcache.cli:main"
[tool.setuptools]
packages = ["windows_webcache", "windows_webcache.esedb"]
[tool.pytest.ini_options]
testpaths = ["tests"]
