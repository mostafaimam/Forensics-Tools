[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_srum"
version = "0.1.0"
description = "parse SRUDB.dat (System Resource Usage Monitor) into a per-app hourly timeline: network bytes, connected time, CPU / disk use, energy, push notifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "srum", "srudb", "ese", "network", "timeline"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_srum"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_srum = "windows_srum.cli:main"
[tool.setuptools]
packages = ["windows_srum", "windows_srum.esedb"]
[tool.pytest.ini_options]
testpaths = ["tests"]
