[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_sum"
version = "0.1.0"
description = "Microsoft User Access Logging (SUM) forensics: per-(user, client, role) access aggregates from SystemIdentity.mdb + Current.mdb / {GUID}.mdb, with per-day histograms and public-IP / privileged-account flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "sum", "ual", "user-access-logging", "lateral-movement", "ese"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_sum"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_sum = "windows_sum.cli:main"
[tool.setuptools]
packages = ["windows_sum", "windows_sum.esedb"]
[tool.pytest.ini_options]
testpaths = ["tests"]
