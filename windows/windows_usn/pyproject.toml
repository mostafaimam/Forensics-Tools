[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_usn"
version = "0.1.0"
description = "standalone NTFS change-journal ($UsnJrnl:$J) parser and carver: sequential + carved USN_RECORD v2/v3, folded operations, optional $MFT path resolution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "ntfs", "usnjrnl", "usn", "change-journal", "carving"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_usn"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_usn = "windows_usn.cli:main"
[tool.setuptools]
packages = ["windows_usn"]
[tool.pytest.ini_options]
testpaths = ["tests"]
