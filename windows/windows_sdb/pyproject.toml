[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_sdb"
version = "0.1.0"
description = "Application Compatibility shim-database (.sdb) forensics: parse the tag tree, list shims / patches / EXE entries and flag InjectDll / RedirectEXE / custom-patch persistence vectors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "sdb", "shim", "appcompat", "persistence", "injectdll"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_sdb"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_sdb = "windows_sdb.cli:main"
[tool.setuptools]
packages = ["windows_sdb"]
[tool.pytest.ini_options]
testpaths = ["tests"]
