[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_tasks"
version = "0.1.0"
description = "parse Windows Scheduled Tasks: Tasks XML joined with the TaskCache registry - triggers, actions, principal, timestamps, and a LOLBin / hidden / registry-only review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "scheduled-tasks", "taskcache", "persistence", "timeline"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_tasks"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_tasks = "windows_tasks.cli:main"
[tool.setuptools]
packages = ["windows_tasks", "windows_tasks.hive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
