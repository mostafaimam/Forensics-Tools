[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows_mft"
version = "0.1.0"
description = "NTFS $MFT and $UsnJrnl:$J parser - timeline, ADS, and timestomp detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "ntfs", "mft", "usnjrnl", "timeline", "timestomp"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_mft"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"

[project.scripts]
windows_mft = "windows_mft.cli:main"

[tool.setuptools]
packages = ["windows_mft", "windows_mft.ntfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
