[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_amcache"
version = "0.1.0"
description = "Parse Amcache.hve - executables (with SHA-1), installed programs and drivers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "amcache", "windows", "execution", "program-inventory"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_amcache"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_amcache = "windows_amcache.cli:main"
[tool.setuptools]
packages = ["windows_amcache", "windows_amcache.hive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
