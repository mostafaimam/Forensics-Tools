[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_notifications"
version = "0.1.0"
description = "parse wpndatabase.db (Windows toast / tile notification history): per-app notifications with arrival / expiry times and extracted text"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "notifications", "wpndatabase", "toast", "wns"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_notifications"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_notifications = "windows_notifications.cli:main"
[tool.setuptools]
packages = ["windows_notifications"]
[tool.pytest.ini_options]
testpaths = ["tests"]
