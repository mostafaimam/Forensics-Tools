[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_jumplist"
version = "0.1.0"
description = "Parse automaticDestinations-ms jump lists (OLE2 + DestList + embedded LNK)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "jumplist", "destlist", "ole2", "windows"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_jumplist"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_jumplist = "windows_jumplist.cli:main"
[tool.setuptools]
packages = ["windows_jumplist"]
[tool.pytest.ini_options]
testpaths = ["tests"]
