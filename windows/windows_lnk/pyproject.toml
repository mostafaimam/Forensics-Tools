[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_lnk"
version = "0.1.0"
description = "Parse Windows Shell Link (.lnk) files - target metadata, machine ID, shell items"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "lnk", "shell-link", "windows", "shellbags"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_lnk"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_lnk = "windows_lnk.cli:main"
[tool.setuptools]
packages = ["windows_lnk"]
[tool.pytest.ini_options]
testpaths = ["tests"]
