[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "windows_bam"
version = "0.1.0"
description = "Background / Desktop Activity Moderator last-execution data from a SYSTEM hive: per-user exe last-run times with writable-path / LOLBin / masquerade flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "windows", "bam", "dam", "execution", "registry", "timeline"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/windows/windows_bam"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
windows_bam = "windows_bam.cli:main"
[tool.setuptools]
packages = ["windows_bam", "windows_bam.hive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
