title: Possible Credential Dumping via LSASS Access
id: 8f6a1e10-0001-4a1a-9c1a-000000000005
status: experimental
level: critical
description: PowerShell script block or process command line referencing LSASS memory access / dumping tools.
logsource:
    product: windows
detection:
    selection:
        ScriptBlockText|contains:
            - 'sekurlsa'
            - 'lsadump'
            - 'MiniDumpWriteDump'
            - 'lsass.dmp'
    selection2:
        CommandLine|contains:
            - 'sekurlsa'
            - 'lsadump'
            - 'MiniDumpWriteDump'
            - 'comsvcs.dll'
    condition: 1 of selection*
tags:
    - attack.credential_access
    - attack.t1003.001
