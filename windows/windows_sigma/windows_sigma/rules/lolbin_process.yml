title: Suspicious LOLBin Process Creation
id: 8f6a1e10-0001-4a1a-9c1a-000000000003
status: experimental
level: medium
description: A living-off-the-land binary launched with a command line that suggests download, execution or discovery activity.
logsource:
    product: windows
    category: process_creation
detection:
    selection_bin:
        Image|endswith:
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\wmic.exe'
    selection_cli:
        CommandLine|contains:
            - '-urlcache'
            - 'http://'
            - 'https://'
            - 'javascript:'
            - '/format'
    condition: selection_bin and selection_cli
fields:
    - Image
    - CommandLine
    - User
tags:
    - attack.execution
    - attack.t1218
    - attack.defense_evasion
