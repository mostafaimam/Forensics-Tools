[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cloud_gws"
version = "0.1.0"
description = "Normalise Google Workspace audit activity (Admin SDK Reports API JSON export) into one row per event; flags login failures, suspicious logins, admin role changes, OAuth grants, external Drive sharing, and 2SV disablement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "cloud", "google-workspace", "gsuite", "audit-log", "reports-api"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/cloud/cloud_gws"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
cloud_gws = "cloud_gws.cli:main"
[tool.setuptools]
packages = ["cloud_gws"]
[tool.pytest.ini_options]
testpaths = ["tests"]
