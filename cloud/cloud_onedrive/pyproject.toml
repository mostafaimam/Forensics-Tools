[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cloud_onedrive"
version = "0.1.0"
description = "Locate and generically inspect OneDrive sync-client metadata: settings/*.ini key-value parsing and a schema-tolerant SyncEngineDatabase.db table dump (proprietary, undocumented format - no false precision claimed)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "cloud", "onedrive", "sync-client"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/cloud/cloud_onedrive"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
cloud_onedrive = "cloud_onedrive.cli:main"
[tool.setuptools]
packages = ["cloud_onedrive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
