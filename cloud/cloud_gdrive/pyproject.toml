[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cloud_gdrive"
version = "0.1.0"
description = "Locate and generically inspect Google Drive for Desktop sync-client metadata (metadata_sqlite_db, snapshot.db): a schema-tolerant table dump, no claimed understanding of the proprietary items/stable_ids schema beyond conservative column-name hints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "cloud", "google-drive", "drivefs", "sync-client"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/cloud/cloud_gdrive"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
cloud_gdrive = "cloud_gdrive.cli:main"
[tool.setuptools]
packages = ["cloud_gdrive"]
[tool.pytest.ini_options]
testpaths = ["tests"]
