[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cloud_azuread"
version = "0.1.0"
description = "Normalise Entra ID (Azure AD) sign-in and directory audit log JSON exports into one row per event; flags legacy authentication, risky sign-ins, conditional-access failures, first-seen-country, and sensitive audit activities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "cloud", "azure", "entra-id", "azuread", "audit-log", "signin"]
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/cloud/cloud_azuread"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
cloud_azuread = "cloud_azuread.cli:main"
[tool.setuptools]
packages = ["cloud_azuread"]
[tool.pytest.ini_options]
testpaths = ["tests"]
