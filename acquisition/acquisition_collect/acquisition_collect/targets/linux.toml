# Built-in Linux triage targets for acquisition_collect.
# %Home% fans out over every real user home directory under /home (and /root).

[[target]]
id = "linux-auth-logs"
name = "Authentication logs"
category = "Logs"
os = ["linux"]
paths = [
  { path = "/var/log/auth.log*" },
  { path = "/var/log/secure*" },
  { path = "/var/log/faillog" },
  { path = "/var/log/lastlog" },
  { path = "/var/log/wtmp*" },
  { path = "/var/log/btmp*" },
]

[[target]]
id = "linux-syslog"
name = "System logs (syslog / messages / kern / dmesg)"
category = "Logs"
os = ["linux"]
paths = [
  { path = "/var/log/syslog*" },
  { path = "/var/log/messages*" },
  { path = "/var/log/kern.log*" },
  { path = "/var/log/dmesg*" },
  { path = "/var/log/boot.log*" },
]

[[target]]
id = "linux-journal"
name = "systemd journal"
category = "Logs"
os = ["linux"]
paths = [
  { path = "/var/log/journal", recursive = true },
  { path = "/run/log/journal", recursive = true },
]

[[target]]
id = "linux-audit"
name = "auditd logs"
category = "Logs"
os = ["linux"]
paths = [
  { path = "/var/log/audit", recursive = true },
  { path = "/etc/audit", recursive = true },
]

[[target]]
id = "linux-cron"
name = "cron / at scheduled jobs"
category = "Persistence"
os = ["linux"]
paths = [
  { path = "/etc/crontab" },
  { path = "/etc/cron.d", recursive = true },
  { path = "/etc/cron.daily", recursive = true },
  { path = "/etc/cron.hourly", recursive = true },
  { path = "/etc/cron.weekly", recursive = true },
  { path = "/etc/cron.monthly", recursive = true },
  { path = "/var/spool/cron", recursive = true },
  { path = "/var/spool/at", recursive = true },
]

[[target]]
id = "linux-systemd-units"
name = "systemd unit files"
category = "Persistence"
os = ["linux"]
paths = [
  { path = "/etc/systemd/system", recursive = true },
  { path = "/lib/systemd/system", recursive = true },
  { path = "/usr/lib/systemd/system", recursive = true },
  { path = "/run/systemd/system", recursive = true },
  { path = "%Home%/.config/systemd", recursive = true },
]

[[target]]
id = "linux-shell-history"
name = "Shell / interpreter history"
category = "UserActivity"
os = ["linux"]
paths = [
  { path = "%Home%/.bash_history" },
  { path = "%Home%/.zsh_history" },
  { path = "%Home%/.sh_history" },
  { path = "%Home%/.ash_history" },
  { path = "%Home%/.python_history" },
  { path = "%Home%/.mysql_history" },
  { path = "%Home%/.psql_history" },
  { path = "%Home%/.lesshst" },
  { path = "%Home%/.viminfo" },
]

[[target]]
id = "linux-ssh"
name = "SSH configuration and keys"
category = "Authentication"
os = ["linux"]
paths = [
  { path = "/etc/ssh", recursive = true },
  { path = "%Home%/.ssh", recursive = true },
]

[[target]]
id = "linux-accounts"
name = "Accounts, sudo and PAM configuration"
category = "Accounts"
os = ["linux"]
paths = [
  { path = "/etc/passwd" },
  { path = "/etc/group" },
  { path = "/etc/shadow" },
  { path = "/etc/gshadow" },
  { path = "/etc/sudoers" },
  { path = "/etc/sudoers.d", recursive = true },
  { path = "/etc/pam.d", recursive = true },
]

[[target]]
id = "linux-network-config"
name = "Networking configuration"
category = "Network"
os = ["linux"]
paths = [
  { path = "/etc/hosts" },
  { path = "/etc/hostname" },
  { path = "/etc/resolv.conf" },
  { path = "/etc/nsswitch.conf" },
  { path = "/etc/network", recursive = true },
  { path = "/etc/netplan", recursive = true },
  { path = "/etc/NetworkManager/system-connections", recursive = true },
]

[[target]]
id = "linux-shell-profiles"
name = "Shell startup / profile files"
category = "Persistence"
os = ["linux"]
paths = [
  { path = "/etc/profile" },
  { path = "/etc/profile.d", recursive = true },
  { path = "/etc/bash.bashrc" },
  { path = "/etc/environment" },
  { path = "%Home%/.bashrc" },
  { path = "%Home%/.bash_profile" },
  { path = "%Home%/.bash_logout" },
  { path = "%Home%/.profile" },
  { path = "%Home%/.zshrc" },
  { path = "%Home%/.zprofile" },
]

[[target]]
id = "linux-package-logs"
name = "Package manager logs (apt / dpkg / dnf / yum)"
category = "SoftwareInventory"
os = ["linux"]
paths = [
  { path = "/var/log/apt", recursive = true },
  { path = "/var/log/dpkg.log*" },
  { path = "/var/log/dnf.log*" },
  { path = "/var/log/yum.log*" },
  { path = "/var/lib/dpkg/status" },
]

[[target]]
id = "linux-webserver-logs"
name = "Web server logs (apache / nginx / httpd)"
category = "Logs"
os = ["linux"]
paths = [
  { path = "/var/log/apache2", recursive = true },
  { path = "/var/log/nginx", recursive = true },
  { path = "/var/log/httpd", recursive = true },
  { path = "/var/log/lighttpd", recursive = true },
]

[[target]]
id = "linux-autostart"
name = "Desktop autostart entries"
category = "Persistence"
os = ["linux"]
paths = [
  { path = "/etc/xdg/autostart", recursive = true },
  { path = "%Home%/.config/autostart", recursive = true },
]

[[target]]
id = "linux-os-release"
name = "OS / kernel identification"
category = "SystemInfo"
os = ["linux"]
paths = [
  { path = "/etc/os-release" },
  { path = "/etc/lsb-release" },
  { path = "/etc/machine-id" },
  { path = "/proc/version" },
  { path = "/etc/fstab" },
]
