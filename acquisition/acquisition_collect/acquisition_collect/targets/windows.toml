]

[[target]]
id = "windows-hosts-etc"
name = "hosts / networking config"
category = "Network"
os = ["windows"]
paths = [
  { path = '%SystemRoot%\System32\drivers\etc', recursive = true },
]

[[target]]
id = "windows-setupapi"
name = "SetupAPI device logs (USB / device first-connect)"
category = "DeviceUsage"
os = ["windows"]
paths = [
  { path = '%SystemRoot%\inf\setupapi.dev.log*' },
  { path = '%SystemRoot%\inf\setupapi.setup.log*' },
]

[[target]]
id = "windows-browser-chromium"
