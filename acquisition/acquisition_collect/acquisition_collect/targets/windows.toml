  { path = '%UserProfiles%\AppData\Local\Google\Chrome\User Data\*\Cookies' },
  { path = '%UserProfiles%\AppData\Local\Google\Chrome\User Data\*\Login Data' },
  { path = '%UserProfiles%\AppData\Local\Google\Chrome\User Data\*\Web Data' },
  { path = '%UserProfiles%\AppData\Local\Google\Chrome\User Data\*\Bookmarks' },
  { path = '%UserProfiles%\AppData\Local\Google\Chrome\User Data\*\Network\Cookies' },
  { path = '%UserProfiles%\AppData\Local\Microsoft\Edge\User Data\*\History' },
  { path = '%UserProfiles%\AppData\Local\Microsoft\Edge\User Data\*\Cookies' },
  { path = '%UserProfiles%\AppData\Local\Microsoft\Edge\User Data\*\Login Data' },
  { path = '%UserProfiles%\AppData\Local\Microsoft\Edge\User Data\*\Web Data' },
  { path = '%UserProfiles%\AppData\Local\Microsoft\Edge\User Data\*\Network\Cookies' },
