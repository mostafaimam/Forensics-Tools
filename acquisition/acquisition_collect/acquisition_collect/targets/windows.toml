# Built-in Windows triage targets for acquisition_collect.
# Paths use single-quoted TOML literal strings so backslashes are taken as-is.
# %VARS%:  %SystemDrive% %SystemRoot% %WinDir% %ProgramData% %Users%
#          %UserProfiles%  (fans out over every real user profile)

[[target]]
id = "windows-mft"
name = "NTFS filesystem metadata ($MFT, $LogFile, $UsnJrnl, $Boot)"
description = "Core NTFS metadata files. Held open by the OS - require --backend vss."
category = "FileSystem"
os = ["windows"]
needs_raw = true
paths = [
  { path = '%SystemDrive%\$MFT' },
  { path = '%SystemDrive%\$LogFile' },
  { path = '%SystemDrive%\$Boot' },
  { path = '%SystemDrive%\$Extend\$UsnJrnl:$J', comment = "USN change journal $J data stream" },
  { path = '%SystemDrive%\$Extend\$UsnJrnl:$Max' },
]

[[target]]
id = "windows-registry-system"
name = "System registry hives"
description = "SYSTEM, SOFTWARE, SAM, SECURITY, DEFAULT plus transaction logs and RegBack."
category = "Registry"
os = ["windows"]
paths = [
  { path = '%SystemRoot%\System32\config\SYSTEM*' },
  { path = '%SystemRoot%\System32\config\SOFTWARE*' },
  { path = '%SystemRoot%\System32\config\SAM*' },
  { path = '%SystemRoot%\System32\config\SECURITY*' },
  { path = '%SystemRoot%\System32\config\DEFAULT*' },
  { path = '%SystemRoot%\System32\config\RegBack', recursive = true },
]

[[target]]
id = "windows-registry-user"
name = "Per-user registry hives (NTUSER.DAT, UsrClass.dat)"
category = "Registry"
os = ["windows"]
paths = [
  { path = '%UserProfiles%\NTUSER.DAT*' },
  { path = '%UserProfiles%\AppData\Local\Microsoft\Windows\UsrClass.dat*' },
]

[[target]]
id = "windows-amcache"
name = "Amcache.hve (program execution / presence)"
category = "ProgramExecution"
os = ["windows"]
paths = [
  { path = '%SystemRoot%\AppCompat\Programs\Amcache.hve*' },
]

[[target]]
id = "windows-prefetch"
name = "Prefetch (*.pf)"
category = "ProgramExecution"
os = ["windows"]
paths = [
  { path = '%SystemRoot%\Prefetch\*.pf' },
  { path = '%SystemRoot%\Prefetch\Layout.ini' },
]

[[target]]
id = "windows-eventlogs"
name = "Windows event logs (*.evtx)"
category = "EventLogs"
os = ["windows"]
paths = [
  { path = '%SystemRoot%\System32\winevt\Logs\*.evtx' },
]

[[target]]
id = "windows-scheduledtasks"
name = "Scheduled tasks"
category = "Persistence"
os = ["windows"]
paths = [
  { path = '%SystemRoot%\System32\Tasks', recursive = true },
  { path = '%SystemRoot%\Tasks\*.job' },
  { path = '%SystemRoot%\System32\config\TxR', recursive = true },
]

[[target]]
id = "windows-srum"
name = "SRUM database (SRUDB.dat) - resource usage"
category = "SystemActivity"
os = ["windows"]
paths = [
  { path = '%SystemRoot%\System32\sru\SRUDB.dat' },
  { path = '%SystemRoot%\System32\sru\SRU*' },
]

[[target]]
id = "windows-timeline"
name = "Windows Timeline (ActivitiesCache.db)"
category = "SystemActivity"
os = ["windows"]
paths = [
  { path = '%UserProfiles%\AppData\Local\ConnectedDevicesPlatform', recursive = true },
]

[[target]]
id = "windows-jumplists"
name = "Jump lists (Automatic/CustomDestinations)"
category = "FileFolderAccess"
os = ["windows"]
paths = [
  { path = '%UserProfiles%\AppData\Roaming\Microsoft\Windows\Recent\AutomaticDestinations', recursive = true },
  { path = '%UserProfiles%\AppData\Roaming\Microsoft\Windows\Recent\CustomDestinations', recursive = true },
]

[[target]]
id = "windows-lnk-recent"
name = "Recent LNK shortcut files"
category = "FileFolderAccess"
os = ["windows"]
paths = [
  { path = '%UserProfiles%\AppData\Roaming\Microsoft\Windows\Recent\*.lnk' },
  { path = '%UserProfiles%\AppData\Roaming\Microsoft\Office\Recent', recursive = true },
]

[[target]]
id = "windows-recyclebin"
name = "Recycle Bin ($I / $R / INFO2)"
category = "FileDeletion"
os = ["windows"]
paths = [
  { path = '%SystemDrive%\$Recycle.Bin', recursive = true },
  { path = '%SystemDrive%\RECYCLER', recursive = true },
]

[[target]]
id = "windows-powershell-history"
name = "PowerShell console history (PSReadLine)"
category = "ProgramExecution"
os = ["windows"]
paths = [
  { path = '%UserProfiles%\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt' },
]

[[target]]
id = "windows-startup"
name = "Startup folders (per-user and all-users)"
category = "Persistence"
os = ["windows"]
paths = [
  { path = '%UserProfiles%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup', recursive = true },
  { path = '%ProgramData%\Microsoft\Windows\Start Menu\Programs\Startup', recursive = true },
]

[[target]]
id = "windows-wmi-repository"
name = "WMI CIM repository (persistence)"
