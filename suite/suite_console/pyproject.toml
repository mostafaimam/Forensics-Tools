[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "suite_console"
version = "0.1.0"
description = "A single desktop shell for all 142 tools in this repository - auto-discovers every tool's own argparse spec to build a form, runs it as an isolated subprocess, and can open any tool's own native GUI alongside it. No per-tool integration code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "gui", "launcher", "console"]
classifiers = ["Environment :: X11 Applications", "Environment :: Win32 (MS Windows)", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []
[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/suite/suite_console"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"
[project.scripts]
suite_console = "suite_console.cli:main"
[tool.setuptools]
packages = ["suite_console"]
[tool.pytest.ini_options]
testpaths = ["tests"]
