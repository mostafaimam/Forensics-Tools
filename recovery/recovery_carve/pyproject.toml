[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery_carve"
version = "0.1.0"
description = "Recover files by magic-byte signature carving with structural validators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "file-carving", "data-recovery", "incident-response"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/recovery/recovery_carve"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"

[project.scripts]
recovery_carve = "recovery_carve.cli:main"

[tool.setuptools]
packages = ["recovery_carve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
