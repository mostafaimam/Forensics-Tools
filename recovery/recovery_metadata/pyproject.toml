[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery_metadata"
version = "0.1.0"
description = "Recover files from file-system metadata (NTFS $MFT): list and extract, including deleted files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Imam" }]
keywords = ["dfir", "forensics", "ntfs", "mft", "data-recovery", "deleted-files"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mostafaimam/Forensics-Tools/tree/main/recovery/recovery_metadata"
Issues = "https://github.com/mostafaimam/Forensics-Tools/issues"

[project.scripts]
recovery_metadata = "recovery_metadata.cli:main"

[tool.setuptools]
packages = ["recovery_metadata", "recovery_metadata.ntfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
